<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kulzzy Upload Manager</title>

<style>
body{
background:#111;
color:#fff;
font-family:Arial,sans-serif;
padding:20px;
}

h1{
text-align:center;
}

select,input,button{
width:100%;
padding:15px;
margin-top:12px;
font-size:18px;
border-radius:8px;
border:none;
box-sizing:border-box;
}

button{
background:#d60000;
color:white;
font-weight:bold;
cursor:pointer;
}

#status{
margin-top:20px;
text-align:center;
font-size:18px;
color:#FFD700;
}
</style>

</head>
<body>

<h1>📁 Kulzzy Upload Manager</h1>

<select id="folder">
<option value="audio">🎵 Music</option>
<option value="jingles">🎛 Jingles</option>
<option value="images">🖼 Images</option>
</select>

<input type="file" id="file">

<button id="uploadBtn">
⬆ Upload File
</button>

<div id="status">
Waiting...
</div>

<script src="upload.js?v=2"></script>

</body>
  </html>
