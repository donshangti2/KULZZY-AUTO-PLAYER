<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kulzzy Radio Test</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #020d1a;
            min-height: 100%;
        }

        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #020d1a;
            border-top: 3px solid #ffd000;
            padding: 10px 0;
            box-sizing: border-box;
        }

        .title {
            text-align: center;
            color: #ffd000;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .caster {
            width: 100%;
            max-width: 700px;
            margin: auto;
        }
    </style>
</head>

<body>

<div class="player">

    <div class="title">
        🔴 KULZZY RADIO NETWORK
    </div>

    <div class="caster">

        <div
            data-type="newStreamPlayer"
            data-publicToken="8c96ae48-5e72-43d8-a87e-e90f623ac080"
            data-theme="light"
            data-color="e81e4d"
            data-channelId=""
            data-rendered="false"
            class="cstrEmbed">

            <a href="https://www.caster.fm">
                Shoutcast Hosting
            </a>

            <a href="https://www.caster.fm">
                Stream Hosting
            </a>

            <a href="https://www.caster.fm">
                Radio Server Hosting
            </a>

        </div>

    </div>

</div>

<script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>

</body>
</html>
