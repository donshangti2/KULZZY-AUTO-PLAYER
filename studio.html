<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kulzzy Radio Studio</title>

<style>

body{
margin:0;
background:#111;
font-family:Arial;
color:white;
padding:20px;
}

h1{
text-align:center;
}

.card{
background:#1b1b1b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

button{
width:100%;
padding:18px;
margin:10px 0;
font-size:22px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.live{
background:#d60000;
color:#fff;
}

.stop{
background:#444;
color:#fff;
}

.playlist{
background:#FFD700;
color:#000;
}

.chat{
background:#0066ff;
color:#fff;
}

.calls{
background:#00aa55;
color:#fff;
}

.status{
font-size:24px;
text-align:center;
margin:20px 0;
font-weight:bold;
color:#FFD700;
}

</style>

</head>

<body>

<h1>🎙 Kulzzy Radio Studio</h1>

<div class="status" id="status">

🟢 OFF AIR

</div>

<div class="card">

<button class="live" id="goLive">
🔴 GO LIVE
</button>

<button class="stop" id="stopLive">
⛔ END LIVE
</button>

<button class="playlist" id="playlist">
🎵 PLAYLIST MODE
</button>

<button class="chat">
💬 LIVE CHAT
</button>

<button class="calls">
📞 CALL REQUESTS
</button>
<hr>

<h2>🎵 JINGLE CARTS</h2>
<h2>🎛 KULZZY CART WALL</h2>

<div class="cartGrid">

<button id="cart1">🎂 Birthday Intro</button>
<button id="cart2">💼 Business Intro</button>
<button id="cart3">📻 Station ID</button>
<button id="cart4">📰 News Intro</button>

<button id="cart5">🚨 Breaking News</button>
<button id="cart6">⚽ Sports Intro</button>
<button id="cart7">🎵 Gospel Intro</button>
<button id="cart8">🎤 DJ Drop</button>

<button id="cart9">📢 Advert Bed</button>
<button id="cart10">☎ Phone Ring</button>
<button id="cart11">👏 Applause</button>
<button id="cart12">📣 Air Horn</button>

</div>

<hr>

<h2>🎚 AUDIO MIXER</h2>

<label>🎙 Mic Volume</label>

<input
type="range"
id="micVolume"
min="0"
max="100"
value="100">

<label>🎵 Music Volume</label>

<input
type="range"
id="musicVolume"
min="0"
max="100"
value="100">

<hr>

<h2>📊 STUDIO STATUS</h2>

<p id="listeners">
👥 Listeners: 0
</p>

<p id="chatCount">
💬 Chat Messages: 0
</p>

<p id="callCount">
📞 Calls Waiting: 0
</p>

<hr>

<h2>🎵 NOW PLAYING</h2>

<input
id="studioNowPlaying"
placeholder="Enter current program or song">

<button id="updateNowPlaying">
💾 Update Now Playing
  </button>
</div>

<script src="studio.js"></script>

</body>
  </html>
