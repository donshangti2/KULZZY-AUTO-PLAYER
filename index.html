<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Network</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #020d1a;
    font-family: Arial, sans-serif;
}

/* FLOATING RADIO PLAYER */

#radioPlayer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 999999;
    background: #020d1a;
    border-top: 3px solid #ffd000;
    box-shadow: 0 -5px 25px rgba(0,0,0,0.7);
}

/* KULZZY HEADER */

.kulzzyHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 15px;
    background: #03182c;
    border-bottom: 1px solid #26384a;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.redDot {
    width: 16px;
    height: 16px;
    background: red;
    border-radius: 50%;
    box-shadow: 0 0 12px red;
}

.brandName {
    color: #ffd000;
    font-size: 18px;
    font-weight: bold;
}

.slogan {
    color: #aeb9c5;
    font-size: 12px;
    margin-top: 3px;
}

.liveBadge {
    background: red;
    color: white;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

/* CASTER PLAYER */

.casterBox {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 5px;
    box-sizing: border-box;
}

.cstrEmbed {
    width: 100%;
}

/* FOOTER */

.footer {
    text-align: center;
    color: #777;
    font-size: 10px;
    padding: 5px;
}

.footer span {
    color: #ffd000;
}

@media (max-width: 600px) {

    .brandName {
        font-size: 16px;
    }

    .slogan {
        font-size: 10px;
    }

    .liveBadge {
        font-size: 11px;
        padding: 7px 12px;
    }

}

</style>
</head>

<body>

<div id="radioPlayer">

    <!-- KULZZY RADIO HEADER -->

    <div class="kulzzyHeader">

        <div class="brand">

            <div class="redDot"></div>

            <div>

                <div class="brandName">
                    KULZZY RADIO NETWORK
                </div>

                <div class="slogan">
                    Celebrating Lives Everyday
                </div>

            </div>

        </div>

        <div class="liveBadge">
            ● LIVE
        </div>

    </div>


    <!-- CASTER.FM PLAYER -->

    <div class="casterBox">

        <div
            data-type="newStreamPlayer"
            data-publicToken="8c96ae48-5e72-43d8-a87e-e90f623ac080"
            data-theme="light"
            data-color="e81e4d"
            data-channelId="a272a955-fc0c-4968-8280-2a2cb7e434ec"
            data-rendered="false"
            class="cstrEmbed">

            <a href="https://www.caster.fm">
                Shoutcast Hosting
            </a>

            <a href="https://www.caster.fm">
                Stream Hosting
            </a>

            <a href="https://www.caster.fm">
                Radio Server Hosting
            </a>

        </div>

    </div>


    <div class="footer">

        KULZZY RADIO NETWORK
        •
        <span>Celebrating Lives Everyday</span>

    </div>

</div>


<!-- CASTER.FM SCRIPT -->

<script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>

</body>
</html>
