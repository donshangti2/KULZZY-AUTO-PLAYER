  <!-- RADIO PLAYER -->
  <div class="radio-player-box">

    <!-- Keep your existing radio player code INSIDE here -->
    <div id="radioPlayer">

      <div class="kulzzyHeader">

        <div class="brand">
          <div class="redDot"></div>

          <div>
            <div class="brandName">
              KULZZY RADIO NETWORK
            </div>

            <div class="slogan">
              Celebrating Lives Everyday
            </div>
          </div>
        </div>

        <div class="liveBadge">
          ● LIVE
        </div>

      </div>

      <!-- BIG PLAY BUTTON -->
      <div style="text-align:center;padding:20px;">

        <div style="
          color:#ffd000;
          font-size:16px;
          font-weight:bold;
          margin-bottom:10px;
        ">
          🎵 AUTOMATIC AUDIO
        </div>

        <button id="playButton" style="
          width:100px;
          height:100px;
          border-radius:50%;
          border:4px solid #ffd000;
          background:#ff0000;
          color:white;
          font-size:45px;
          cursor:pointer;
          box-shadow:0 0 25px rgba(255,0,0,.8);
        ">
          ▶
        </button>

      </div>

      <div class="footer">
        KULZZY RADIO NETWORK
        •

  <!-- OUR LISTENERS -->

    <div class="listenersTitle">

      <span class="beepDot"></span>

      <span>OUR LISTENERS</span>

    </div>

    <div id="listenerCount">
      0
    </div>

  </div>

</div>


<style>

/* =====================================
   RADIO + LISTENERS LAYOUT
===================================== */

.radio-and-listeners {

  width:100%;

  max-width:1100px;

  margin:20px auto;

  display:flex;

  align-items:stretch;

  justify-content:center;

  gap:15px;

  box-sizing:border-box;

  padding:0 10px;

}


/* RADIO PLAYER */

.radio-player-box {

  flex:1;

  min-width:0;

  background:#020d1a;

  border-top:3px solid #ffd000;

  box-shadow:0 0 15px rgba(0,0,0,.5);

}


/* LISTENERS BOX */

#ourListenersCounter {

  width:300px;

  background:#ffd000;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  padding:20px 10px;

  box-sizing:border-box;

  font-family:Arial,sans-serif;

  user-select:none;

}


/* TITLE */

.listenersTitle {

  font-size:28px;

  font-weight:bold;

  color:#000;

  white-space:nowrap;

}


/* BLINKING RED DOT */

.beepDot {

  display:inline-block;

  width:16px;

  height:16px;

  background:red;

  border-radius:50%;

  margin-right:8px;

  animation:blink 1s infinite;

  vertical-align:middle;

}


/* NUMBER */

#listenerCount {

  font-size:70px;

  font-weight:bold;

  color:red;

  margin-top:12px;

  line-height:1;

}


/* BLINK */

@keyframes blink {

  0%,100% {

    opacity:1;

    transform:scale(1);

    box-shadow:0 0 6px red;

  }

  50% {

    opacity:.2;

    transform:scale(1.3);

    box-shadow:0 0 20px red;

  }

}


/* MOBILE */

@media(max-width:600px) {

  .radio-and-listeners {

    gap:5px;

    padding:0 5px;

  }

  .radio-player-box {

    flex:1.5;

  }

  #ourListenersCounter {

    width:40%;

    padding:10px 3px;

  }

  .listenersTitle {

    font-size:13px;

  }

  .beepDot {

    width:8px;

    height:8px;

    margin-right:3px;

  }

  #listenerCount {

    font-size:40px;

    margin-top:8px;

  }

}


/* VERY SMALL PHONES */

@media(max-width:380px) {

  .listenersTitle {

    font-size:11px;

  }

  #listenerCount {

    font-size:32px;

  }

}

</style>


<script>

/* =====================================
   OUR LISTENERS COUNTER
===================================== */

(function(){

  let count =
    Math.floor(Math.random() * 9000) + 1000;

  const display =
    document.getElementById("listenerCount");

  display.textContent =
    count.toLocaleString();


  function updateCounter(){

    const up =
      Math.random() > 0.5;

    const change =
      (Math.floor(Math.random() * 8) + 1) * 10;


    if(up){

      count += change;

    }else{

      count -= change;

    }


    if(count < 1000)
      count = 1000;

    if(count > 9999)
      count = 9999;


    display.textContent =
      count.toLocaleString();

  }


  setInterval(updateCounter,4000);

})();

</script>
