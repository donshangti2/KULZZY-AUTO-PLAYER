<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Network</title>

<style>

/* =====================================================
   KULZZY RADIO NETWORK
   PROFESSIONAL FLOATING PLAYER
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #020d1a;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =====================================================
   MAIN PLAYER
   ===================================================== */

#radioPlayer {

    width: 100%;

    background:
        linear-gradient(
            180deg,
            #03182c 0%,
            #020d1a 100%
        );

    color: white;

    border-top:
        4px solid #ffd000;

    overflow: hidden;

}


/* =====================================================
   KULZZY HEADER
   ===================================================== */

.kulzzyHeader {

    display: flex;

    align-items: center;

    justify-content: space-between;

    width: 100%;

    padding:
        14px
        18px;

    background: #03182c;

    border-bottom:
        1px solid
        rgba(255,255,255,0.12);

}


.brand {

    display: flex;

    align-items: center;

    gap: 12px;

}


.redDot {

    width: 20px;
    height: 20px;

    min-width: 20px;

    background: #ff0015;

    border-radius: 50%;

    box-shadow:
        0 0 10px #ff0015,
        0 0 22px rgba(255,0,21,0.7);

}


.brandName {

    color: #ffd000;

    font-size: 20px;

    font-weight: 800;

    letter-spacing:
        0.3px;

}


.slogan {

    margin-top: 4px;

    color: #b7c3ce;

    font-size: 13px;

}


.liveBadge {

    display: flex;

    align-items: center;

    gap: 5px;

    background: #ff0015;

    color: white;

    padding:
        10px
        15px;

    border-radius: 25px;

    font-size: 13px;

    font-weight: bold;

    box-shadow:
        0 0 15px
        rgba(255,0,21,0.55);

}


/* =====================================================
   PLAYER CONTENT
   ===================================================== */

.playerContent {

    width: 100%;

    text-align: center;

    padding:
        18px
        15px
        22px;

}


/* =====================================================
   PLAYER + OUR LISTENERS SIDE BY SIDE
   ===================================================== */

.playerAndListeners {

    width: 100%;

    max-width: 850px;

    margin: 0 auto;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 35px;

}


/* =====================================================
   PLAYER SIDE
   ===================================================== */

.playerSide {

    flex: 1;

    min-width: 0;

    text-align: center;

}


/* =====================================================
   STATUS
   ===================================================== */

.statusText {

    color: #ffd000;

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 12px;

    letter-spacing:
        0.5px;

}


/* =====================================================
   HUGE PLAY BUTTON
   ===================================================== */

#bigPlayButton {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 145px;

    height: 145px;

    margin:
        10px
        auto
        14px;

    border-radius: 50%;

    border:
        5px solid
        #ffd000;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ff5050,
            #ed0015 45%,
            #b90010 100%
        );

    color: white;

    font-size: 65px;

    line-height: 1;

    cursor: pointer;

    box-shadow:
        0 0 15px
        rgba(255,0,0,0.8),

        0 0 35px
        rgba(255,0,0,0.45),

        0 5px 15px
        rgba(0,0,0,0.7);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

    -webkit-tap-highlight-color:
        transparent;

}


#bigPlayButton:active {

    transform:
        scale(0.93);

    box-shadow:
        0 0 10px
        rgba(255,0,0,0.8);

}


#bigPlayButton.playing {

    background:
        radial-gradient(
            circle at 35% 30%,
            #36ff75,
            #00a83b 45%,
            #006b28 100%
        );

    border-color:
        #ffd000;

    box-shadow:
        0 0 18px
        rgba(0,255,80,0.8),

        0 0 40px
        rgba(0,255,80,0.4);

}


/* =====================================================
   BUTTON LABEL
   ===================================================== */

.buttonLabel {

    color: #ffffff;

    font-size: 17px;

    font-weight: bold;

    margin-top: 5px;

}


/* =====================================================
   NOW PLAYING
   ===================================================== */

.nowPlaying {

    width: 95%;

    max-width: 600px;

    margin:
        15px
        auto
        0;

    padding:
        10px
        12px;

    color: #c7d0d9;

    background:
        rgba(255,255,255,0.04);

    border:
        1px solid
        rgba(255,208,0,0.3);

    border-radius: 10px;

    font-size: 13px;

}


/* =====================================================
   OUR LISTENERS
   ===================================================== */

.listenersSide {

    flex: 1;

    min-width: 0;

    text-align: center;

    background: transparent;

}


/* LISTENERS TITLE */

.listenersTitle {

    color: #ffffff;

    font-size: 28px;

    font-weight: bold;

    white-space: nowrap;

}


/* RED BLINKING DOT */

#beepDot {

    display: inline-block;

    width: 16px;

    height: 16px;

    background: red;

    border-radius: 50%;

    margin-right: 8px;

    animation:
        blink 1s infinite;

    vertical-align: middle;

}


/* LISTENER NUMBER */

#listenerCount {

    font-size: 70px;

    font-weight: bold;

    color: red;

    margin-top: 12px;

    line-height: 1;

}


/* LISTENER LABEL */

.listenersSmallText {

    margin-top: 10px;

    color: #aeb9c5;

    font-size: 12px;

}


/* BLINK ANIMATION */

@keyframes blink {

    0%,100% {

        opacity: 1;

        transform:
            scale(1);

        box-shadow:
            0 0 6px red;

    }

    50% {

        opacity: .2;

        transform:
            scale(1.3);

        box-shadow:
            0 0 20px red;

    }

}


/* =====================================================
   AUDIO ELEMENT
   ===================================================== */

#audioPlayer {

    display: none;

}


/* =====================================================
   CASTER LIVE PLAYER
   ===================================================== */

#casterLive {

    width: 100%;

    max-width: 700px;

    margin:
        10px
        auto;

}


/* =====================================================
   FOOTER
   ===================================================== */

.footer {

    width: 100%;

    padding:
        8px
        10px;

    text-align: center;

    color: #687989;

    font-size: 10px;

    border-top:
        1px solid
        rgba(255,255,255,0.08);

}


.footer span {

    color: #ffd000;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    .kulzzyHeader {

        padding:
            13px
            14px;

    }


    .brandName {

        font-size: 17px;

    }


    .slogan {

        font-size: 11px;

    }


    .redDot {

        width: 18px;
        height: 18px;

        min-width: 18px;

    }


    .liveBadge {

        padding:
            9px
            12px;

        font-size: 12px;

    }


    .playerContent {

        padding:
            14px
            8px
            18px;

    }


    /* KEEP PLAYER AND LISTENERS BESIDE EACH OTHER */

    .playerAndListeners {

        gap: 8px;

        align-items: center;

    }


    /* VERY LARGE MOBILE BUTTON */

    #bigPlayButton {

        width: 155px;

        height: 155px;

        font-size: 70px;

        border-width: 5px;

    }


    .buttonLabel {

        font-size: 18px;

    }


    .statusText {

        font-size: 14px;

    }


    /* LISTENERS ON MOBILE */

    .listenersTitle {

        font-size: 18px;

    }


    #beepDot {

        width: 12px;

        height: 12px;

        margin-right: 5px;

    }


    #listenerCount {

        font-size: 48px;

        margin-top: 10px;

    }


    .listenersSmallText {

        font-size: 10px;

    }

}


/* =====================================================
   SMALL PHONES
   ===================================================== */

@media (max-width: 380px) {

    .brandName {

        font-size: 15px;

    }


    .slogan {

        font-size: 10px;

    }


    #bigPlayButton {

        width: 145px;

        height: 145px;

        font-size: 65px;

    }


    .playerAndListeners {

        gap: 4px;

    }


    .listenersTitle {

        font-size: 15px;

    }


    #listenerCount {

        font-size: 40px;

    }

}

</style>

</head>


<body>


<div id="radioPlayer">


    <!-- =================================================
         KULZZY HEADER
         ================================================= -->

    <div class="kulzzyHeader">

        <div class="brand">

            <div class="redDot"></div>

            <div>

                <div class="brandName">
                    KULZZY RADIO NETWORK
                </div>

                <div class="slogan">
                    Celebrating Lives Everyday
                </div>

            </div>

        </div>


        <div class="liveBadge">
            ● LIVE
        </div>

    </div>


    <!-- =================================================
         PLAYER CONTENT
         ================================================= -->

    <div class="playerContent">


        <!-- PLAYER + LISTENERS -->

        <div class="playerAndListeners">


            <!-- PLAYER -->

            <div class="playerSide">


                <div
                    id="statusText"
                    class="statusText">

                    🎵 AUTOMATIC AUDIO

                </div>


                <!-- HUGE PLAY BUTTON -->

                <button
                    id="bigPlayButton"
                    type="button"
                    aria-label="Play Kulzzy Radio">

                    ▶

                </button>


                <div
                    id="buttonLabel"
                    class="buttonLabel">

                    TAP TO PLAY

                </div>


                <!-- NOW PLAYING -->

                <div
                    id="nowPlaying"
                    class="nowPlaying">

                    Kulzzy Radio Network
                    •
                    Celebrating Lives Everyday

                </div>


            </div>


            <!-- =================================================
                 OUR LISTENERS
                 ================================================= -->

            <div class="listenersSide">


                <div class="listenersTitle">

                    <span id="beepDot"></span>

                    OUR LISTENERS

                </div>


                <div id="listenerCount">
                    0
                </div>


                <div class="listenersSmallText">
                    Listening to Kulzzy Radio
                </div>


            </div>


        </div>


        <!-- AUDIO -->

        <audio
            id="audioPlayer"
            preload="none"
            playsinline>
        </audio>


        <!-- CASTER LIVE PLAYER -->

        <div
            id="casterLive"
            style="display:none;">

            <div
                data-type="newStreamPlayer"
                data-publicToken="8c96ae48-5e72-43d8-a87e-e90f623ac080"
                data-theme="dark"
                data-color="e81e4d"
                data-channelId="a272a955-fc0c-4968-8280-2a2cb7e434ec"
                data-rendered="false"
                class="cstrEmbed">

                <a href="https://www.caster.fm">
                    Shoutcast Hosting
                </a>

                <a href="https://www.caster.fm">
                    Stream Hosting
                </a>

                <a href="https://www.caster.fm">
                    Radio Server Hosting
                </a>

            </div>

        </div>


    </div>


    <!-- =================================================
         FOOTER
         ================================================= -->

    <div class="footer">

        KULZZY RADIO NETWORK

        •

        <span>
            Celebrating Lives Everyday
        </span>

    </div>


</div>

     CASTER.FM SCRIPT
     ===================================================== -->

<script
src="https://cdn.cloud.caster.fm/widgets/embed.js">
</script>


<script>

/* =====================================================
   KULZZY RADIO PLAYER
   ===================================================== */

const CONFIG_URL =
    "config.json";


const audio =
    document.getElementById(
        "audioPlayer"
    );


const playButton =
    document.getElementById(
        "bigPlayButton"
    );


const buttonLabel =
    document.getElementById(
        "buttonLabel"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const nowPlaying =
    document.getElementById(
        "nowPlaying"
    );


const casterLive =
    document.getElementById(
        "casterLive"
    );


let currentAudio = "";

let currentMode = "";


/* =====================================================
   OUR LISTENERS COUNTER
   ===================================================== */

let listenerCount =
    Math.floor(
        Math.random() * 9000
    ) + 1000;


const listenerDisplay =
    document.getElementById(
        "listenerCount"
    );


listenerDisplay.textContent =
    listenerCount.toLocaleString();


function updateListeners() {

    const goUp =
        Math.random() > 0.5;


    const change =
        (Math.floor(
            Math.random() * 8
        ) + 1) * 10;


    if (goUp) {

        listenerCount += change;

    } else {

        listenerCount -= change;

    }


    if (
        listenerCount < 1000
    ) {

        listenerCount = 1000;

    }


    if (
        listenerCount > 9999
    ) {

        listenerCount = 9999;

    }


    listenerDisplay.textContent =
        listenerCount.toLocaleString();

}


setInterval(
    updateListeners,
    4000
);


/* =====================================================
   LOAD CONFIG
   ===================================================== */

async function loadConfig() {

    try {

        const response =
            await fetch(
                CONFIG_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Config could not be loaded"
            );

        }


        const config =
            await response.json();


        /* ---------------------------------------------
           UPDATE NOW PLAYING
           --------------------------------------------- */

        if (
            config.nowPlaying &&
            config.nowPlaying.trim() !== ""
        ) {

            nowPlaying.textContent =
                config.nowPlaying;

        } else {

            nowPlaying.textContent =
                "Kulzzy Radio Network • Celebrating Lives Everyday";

        }


        /* ---------------------------------------------
           LIVE MODE
           --------------------------------------------- */

        if (
            String(config.status)
                .toUpperCase() === "LIVE"
        ) {

            switchToLive();

        }


        /* ---------------------------------------------
           AUTOMATIC AUDIO MODE
           --------------------------------------------- */

        else {

            switchToAudio(
                config.currentAudio
            );

        }


    } catch (error) {

        console.log(
            "Kulzzy player:",
            error
        );

        statusText.textContent =
            "🎵 AUTOMATIC AUDIO";

    }

}


/* =====================================================
   SWITCH TO LIVE
   ===================================================== */

function switchToLive() {

    if (
        currentMode === "LIVE"
    ) {

        return;

    }


    currentMode = "LIVE";


    /* Stop automatic audio */

    audio.pause();


    audio.removeAttribute(
        "src"
    );


    audio.load();


    /* Show Caster */

    casterLive.style.display =
        "block";


    /* Hide big automatic button */

    playButton.style.display =
        "none";


    buttonLabel.style.display =
        "none";


    statusText.textContent =
        "🔴 LIVE ON AIR";

}


/* =====================================================
   SWITCH TO AUTOMATIC AUDIO
   ===================================================== */

function switchToAudio(
    audioFile
) {

    if (
        !audioFile
    ) {

        return;

    }


    currentMode = "AUDIO";


    casterLive.style.display =
        "none";


    playButton.style.display =
        "flex";


    buttonLabel.style.display =
        "block";


    statusText.textContent =
        "🎵 AUTOMATIC AUDIO";


    /* ---------------------------------------------
       Only change source when necessary
       --------------------------------------------- */

    if (
        currentAudio !== audioFile
    ) {

        currentAudio =
            audioFile;

        audio.src =
            audioFile +
            "?v=" +
            Date.now();

        audio.load();


        /* Reset button */

        playButton.classList.remove(
            "playing"
        );

        playButton.textContent =
            "▶";

        buttonLabel.textContent =
            "TAP TO PLAY";

    }

}


/* =====================================================
   PLAY BUTTON
   ===================================================== */

playButton.addEventListener(
    "click",
    async function() {

        if (
            currentMode !== "AUDIO"
        ) {

            return;

        }


        try {

            if (
                audio.paused
            ) {

                await audio.play();


                playButton.classList.add(
                    "playing"
                );


                playButton.textContent =
                    "❚❚";


                buttonLabel.textContent =
                    "NOW PLAYING";


            } else {

                audio.pause();


                playButton.classList.remove(
                    "playing"
                );


                playButton.textContent =
                    "▶";


                buttonLabel.textContent =
                    "TAP TO PLAY";

            }


        } catch (error) {

            console.log(
                "Audio play error:",
                error
            );

            buttonLabel.textContent =
                "TAP TO PLAY";

        }

    }
);


/* =====================================================
   WHEN AUDIO ENDS
   ===================================================== */

audio.addEventListener(
    "ended",
    function() {

        playButton.classList.remove(
            "playing"
        );

        playButton.textContent =
            "▶";

        buttonLabel.textContent =
            "TAP TO PLAY";

    }
);

   START
   ==============================
