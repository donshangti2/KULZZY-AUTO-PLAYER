<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Network</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================================
     KULZZY RADIO PLAYER
========================================= -->

<div id="kulzzyPlayer">

    <!-- Header -->
    <div class="kulzzyHeader">

        <div class="stationInfo">

            <div class="radioLight"></div>

            <div>
                <div class="stationName">
                    KULZZY RADIO NETWORK
                </div>

                <div class="stationSlogan">
                    Celebrating Lives Everyday
                </div>
            </div>

        </div>

        <div class="liveBadge">
            🔴 LIVE
        </div>

    </div>


    <!-- Main Player -->
    <div class="playerBody">

        <div class="onAirBadge">
            <span></span>
            LIVE ON AIR
        </div>


        <div class="radioIcon">
            📻
        </div>


        <div class="welcomeTitle">
            Kulzzy Radio Network
        </div>

        <div class="welcomeText">
            Listen Live • Anytime • Anywhere
        </div>


        <!-- =========================================
             CASTER.FM PLAYER
             
             DO NOT REMOVE THE LINKS BELOW.
             CASTER.FM REQUIRES THEM.
        ========================================== -->

        <div class="casterContainer">

            <div
                data-type="streamPlayer"
                data-publicToken="8c96ae48-5e72-43d8-a87e-e90f623ac080"
                data-theme="dark"
                data-color="ffd000"
                data-channelId=""
                data-rendered="false"
                class="cstrEmbed">

                <a href="https://www.caster.fm">
                    Shoutcast Hosting
                </a>

                <a href="https://www.caster.fm">
                    Stream Hosting
                </a>

                <a href="https://www.caster.fm">
                    Radio Server Hosting
                </a>

            </div>

        </div>


        <div class="playerStatus">

            <div>
                🔴 LIVE BROADCAST
            </div>

            <div>
                🎧 LISTENERS
            </div>

        </div>

    </div>


    <!-- Footer -->
    <div class="kulzzyFooter">

        <span>
            KULZZY RADIO NETWORK
        </span>

        <strong>
            Celebrating Lives Everyday
        </strong>

    </div>

</div>


<!-- CASTER.FM PLAYER SCRIPT -->

<script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>

</body>
</html>
