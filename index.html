<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Network</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #020d1a;
    font-family: Arial, sans-serif;
}

/* =====================================
   KULZZY RADIO FLOATING PLAYER
===================================== */

#kulzzy-floating-player {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    background: #000;

    border-top: 3px solid #ffd000;

    box-shadow:
        0 -5px 25px rgba(0,0,0,0.7);

    z-index: 999999;

    padding: 10px 0 8px;

}


/* =====================================
   KULZZY HEADER
===================================== */

.kulzzy-header {

    width: 100%;

    max-width: 700px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 8px 15px;

    box-sizing: border-box;

}


.kulzzy-brand {

    display: flex;

    align-items: center;

    gap: 10px;

}


.kulzzy-live-dot {

    width: 17px;
    height: 17px;

    background: #ff0000;

    border-radius: 50%;

    box-shadow:
        0 0 12px #ff0000;

}


.kulzzy-name {

    color: #ffd000;

    font-size: 19px;

    font-weight: bold;

}


.kulzzy-slogan {

    color: #aaa;

    font-size: 12px;

    margin-top: 3px;

}


.kulzzy-live {

    background: #ff0000;

    color: white;

    padding: 8px 15px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

    box-shadow:
        0 0 12px rgba(255,0,0,.5);

}


/* =====================================
   CASTER PLAYER AREA
===================================== */

.caster-container {

    width: 100%;

    max-width: 700px;

    margin: auto;

    padding: 0 10px;

    box-sizing: border-box;

}


/*
   IMPORTANT:
   THE CASTER.FM EMBED BELOW IS LEFT IN
   ITS ORIGINAL FORM.
*/

.cstrEmbed {

    width: 100%;

}


/* =====================================
   FOOTER
===================================== */

.kulzzy-footer {

    text-align: center;

    color: #777;

    font-size: 10px;

    padding-top: 5px;

}


.kulzzy-footer span {

    color: #ffd000;

}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 600px) {

    #kulzzy-floating-player {

        padding-bottom: 5px;

    }

    .kulzzy-header {

        padding: 7px 12px;

    }

    .kulzzy-name {

        font-size: 16px;

    }

    .kulzzy-slogan {

        font-size: 10px;

    }

    .kulzzy-live {

        font-size: 11px;

        padding: 7px 12px;

    }

    .kulzzy-live-dot {

        width: 14px;

        height: 14px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     KULZZY RADIO FLOATING PLAYER
===================================== -->

<div id="kulzzy-floating-player">


    <!-- KULZZY RADIO HEADER -->

    <div class="kulzzy-header">

        <div class="kulzzy-brand">

            <div class="kulzzy-live-dot"></div>

            <div>

                <div class="kulzzy-name">
                    KULZZY RADIO NETWORK
                </div>

                <div class="kulzzy-slogan">
                    Celebrating Lives Everyday
                </div>

            </div>

        </div>


        <div class="kulzzy-live">
            ● LIVE
        </div>

    </div>



    <!-- =================================
         ORIGINAL CASTER.FM PLAYER
    ================================== -->

    <div class="caster-container">

        <div
            data-type="newStreamPlayer"
            data-publicToken="8c96ae48-5e72-43d8-a87e-e90f623ac080"
            data-theme="light"
            data-color="e81e4d"
            data-channelId=""
            data-rendered="false"
            class="cstrEmbed">

            <a href="https://www.caster.fm">
                Shoutcast Hosting
            </a>

            <a href="https://www.caster.fm">
                Stream Hosting
            </a>

            <a href="https://www.caster.fm">
                Radio Server Hosting
            </a>

        </div>


        <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>

    </div>



    <!-- KULZZY FOOTER -->

    <div class="kulzzy-footer">

        KULZZY RADIO NETWORK
        •
        <span>Celebrating Lives Everyday</span>

    </div>


</div>


</body>
</html>
