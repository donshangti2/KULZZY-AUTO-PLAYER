<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Network</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #020d1a;
    font-family: Arial, sans-serif;
}

/* =====================================================
   KULZZY RADIO FLOATING PLAYER
===================================================== */

#radioPlayer {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    z-index: 999999;

    background: #020d1a;

    border-top: 3px solid #ffd000;

    box-shadow:
        0 -5px 25px rgba(0,0,0,0.75);

}


/* =====================================================
   KULZZY HEADER
===================================================== */

.kulzzyHeader {

    display: flex;

    align-items: center;

    justify-content: space-between;

    width: 100%;

    padding: 12px 16px;

    background: #03182c;

    border-bottom: 1px solid #344454;

}


/* Brand */

.brand {

    display: flex;

    align-items: center;

    gap: 10px;

}


/* Red LIVE light */

.redDot {

    width: 18px;

    height: 18px;

    min-width: 18px;

    background: #ff0000;

    border-radius: 50%;

    box-shadow:
        0 0 8px #ff0000,
        0 0 18px rgba(255,0,0,.7);

}


/* Brand name */

.brandName {

    color: #ffd000;

    font-size: 19px;

    font-weight: 800;

    line-height: 1.1;

}


/* Slogan */

.slogan {

    color: #b8c3cf;

    font-size: 12px;

    margin-top: 4px;

}


/* LIVE badge */

.liveBadge {

    display: flex;

    align-items: center;

    gap: 5px;

    background: #ff1010;

    color: #fff;

    padding: 9px 15px;

    border-radius: 22px;

    font-size: 12px;

    font-weight: bold;

    box-shadow:
        0 0 12px rgba(255,0,0,.5);

}


/* =====================================================
   CASTER PLAYER
===================================================== */

.casterBox {

    width: 100%;

    max-width: 700px;

    margin: 0 auto;

    padding: 8px 8px 4px;

    background: #020d1a;

}


/*
IMPORTANT:

Do NOT hide the Caster.fm player.
Do NOT use display:none.
Do NOT use opacity.
Do NOT use overflow tricks to remove branding.

The free Caster.fm player needs its original
embedded interface to remain functional.
*/

.cstrEmbed {

    width: 100%;

    min-height: 150px;

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    width: 100%;

    text-align: center;

    color: #778594;

    font-size: 10px;

    padding: 5px 10px 7px;

    background: #020d1a;

}


.footer span {

    color: #ffd000;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .kulzzyHeader {

        padding: 11px 14px;

    }

    .brandName {

        font-size: 17px;

    }

    .slogan {

        font-size: 11px;

    }

    .redDot {

        width: 16px;

        height: 16px;

        min-width: 16px;

    }

    .liveBadge {

        font-size: 11px;

        padding: 8px 12px;

    }

    .casterBox {

        padding: 6px 6px 3px;

    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    .brandName {

        font-size: 15px;

    }

    .slogan {

        font-size: 10px;

    }

    .liveBadge {

        padding: 7px 10px;

        font-size: 10px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     KULZZY RADIO FLOATING PLAYER
===================================================== -->

<div id="radioPlayer">


    <!-- KULZZY HEADER -->

    <div class="kulzzyHeader">


        <div class="brand">


            <div class="redDot"></div>


            <div>

                <div class="brandName">
                    KULZZY RADIO NETWORK
                </div>

                <div class="slogan">
                    Celebrating Lives Everyday
                </div>

            </div>


        </div>


        <div class="liveBadge">
            ● LIVE
        </div>


    </div>


    <!-- =================================================
         ORIGINAL CASTER.FM PLAYER
         
         IMPORTANT:
         Leave this embed intact.
    ================================================== -->

    <div class="casterBox">


        <div
            data-type="newStreamPlayer"
            data-publicToken="8c96ae48-5e72-43d8-a87e-e90f623ac080"
            data-theme="light"
            data-color="e81e4d"
            data-channelId=""
            data-rendered="false"
            class="cstrEmbed">


            <a href="https://www.caster.fm">
                Shoutcast Hosting
            </a>

            <a href="https://www.caster.fm">
                Stream Hosting
            </a>

            <a href="https://www.caster.fm">
                Radio Server Hosting
            </a>


        </div>


    </div>


    <!-- FOOTER -->

    <div class="footer">

        KULZZY RADIO NETWORK
        •
        <span>Celebrating Lives Everyday</span>

    </div>


</div>


<!-- =====================================================
     CASTER.FM EMBED SCRIPT
===================================================== -->

<script
src="https://cdn.cloud.caster.fm/widgets/embed.js">
</script>


</body>
</html>
