<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Network - Live</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="kulzzy-player">

    <!-- HEADER -->
    <div class="radio-header">

        <div class="live-dot"></div>

        <div class="header-text">
            <div class="station-name">
                KULZZY RADIO NETWORK
            </div>

            <div class="station-slogan">
                Celebrating Lives Everyday
            </div>
        </div>

        <div class="live-badge">
            ● LIVE
        </div>

    </div>


    <!-- MAIN PLAYER -->
    <div class="player-content">

        <div class="on-air">

            <span class="pulse-dot"></span>

            <span>LIVE ON AIR</span>

        </div>


        <div class="radio-icon">
            📻
        </div>


        <h2>
            Kulzzy Radio Network
        </h2>

        <p class="listen-text">
            Listen Live • Anytime • Anywhere
        </p>


        <!-- CASTER.FM PLAYER -->
        <div class="caster-wrapper">

            <div 
                data-type="newStreamPlayer"
                data-publicToken="8c96ae48-5e72-43d8-a87e-e90f623ac080"
                data-theme="dark"
                data-color="e8b400"
                data-channelId=""
                data-rendered="false"
                class="cstrEmbed">

                <a href="https://www.caster.fm">
                    Shoutcast Hosting
                </a>

                <a href="https://www.caster.fm">
                    Stream Hosting
                </a>

                <a href="https://www.caster.fm">
                    Radio Server Hosting
                </a>

            </div>

        </div>


        <div class="bottom-info">

            <div>
                🔴 <strong>LIVE BROADCAST</strong>
            </div>

            <div>
                🎧 <strong>LISTENERS</strong>
            </div>

        </div>

    </div>


    <!-- FOOTER -->
    <div class="player-footer">

        <span>
            KULZZY RADIO NETWORK
        </span>

        <span class="gold">
            Celebrating Lives Everyday
        </span>

    </div>

</div>


<script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>

</body>
</html>
