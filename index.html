<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Network</title>

<style>

/* =====================================================
   KULZZY RADIO NETWORK
   CLEAN RADIO PLAYER
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #020d1a;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =====================================================
   MAIN PLAYER
   ===================================================== */

#radioPlayer {

    width: 100%;

    background:
        linear-gradient(
            180deg,
            #03182c 0%,
            #020d1a 100%
        );

    color: white;

    border-top:
        4px solid #ffd000;

    overflow: hidden;

}


/* =====================================================
   HEADER
   ===================================================== */

.kulzzyHeader {

    display: flex;

    align-items: center;

    justify-content: space-between;

    width: 100%;

    padding:
        14px
        18px;

    background: #03182c;

    border-bottom:
        1px solid
        rgba(255,255,255,0.12);

}


.brand {

    display: flex;

    align-items: center;

    gap: 12px;

}


.redDot {

    width: 20px;
    height: 20px;

    min-width: 20px;

    background: #ff0015;

    border-radius: 50%;

    box-shadow:
        0 0 10px #ff0015,
        0 0 22px rgba(255,0,21,0.7);

}


.brandName {

    color: #ffd000;

    font-size: 20px;

    font-weight: 800;

}


.slogan {

    margin-top: 4px;

    color: #b7c3ce;

    font-size: 13px;

}


.liveBadge {

    display: flex;

    align-items: center;

    gap: 5px;

    background: #ff0015;

    color: white;

    padding:
        10px
        15px;

    border-radius: 25px;

    font-size: 13px;

    font-weight: bold;

    box-shadow:
        0 0 15px
        rgba(255,0,21,0.55);

}


/* =====================================================
   PLAYER CONTENT
   ===================================================== */

.playerContent {

    width: 100%;

    text-align: center;

    padding:
        18px
        15px
        22px;

}


/* =====================================================
   STATUS
   ===================================================== */

.statusText {

    color: #ffd000;

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 12px;

}


/* =====================================================
   HUGE PLAY BUTTON
   ===================================================== */

#bigPlayButton {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 155px;

    height: 155px;

    margin:
        10px
        auto
        14px;

    padding: 0;

    border-radius: 50%;

    border:
        5px solid
        #ffd000;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ff5050,
            #ed0015 45%,
            #b90010 100%
        );

    color: white;

    font-size: 70px;

    line-height: 1;

    cursor: pointer;

    box-shadow:
        0 0 15px
        rgba(255,0,0,0.8),

        0 0 35px
        rgba(255,0,0,0.45),

        0 5px 15px
        rgba(0,0,0,0.7);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

    -webkit-tap-highlight-color:
        transparent;

}


#bigPlayButton:active {

    transform:
        scale(0.93);

}


#bigPlayButton.playing {

    background:
        radial-gradient(
            circle at 35% 30%,
            #36ff75,
            #00a83b 45%,
            #006b28 100%
        );

    border-color:
        #ffd000;

    box-shadow:
        0 0 18px
        rgba(0,255,80,0.8),

        0 0 40px
        rgba(0,255,80,0.4);

}


/* =====================================================
   BUTTON LABEL
   ===================================================== */

.buttonLabel {

    color: #ffffff;

    font-size: 18px;

    font-weight: bold;

    margin-top: 5px;

}


/* =====================================================
   NOW PLAYING
   ===================================================== */

.nowPlaying {

    width: 95%;

    max-width: 600px;

    margin:
        15px
        auto
        0;

    padding:
        10px
        12px;

    color: #c7d0d9;

    background:
        rgba(255,255,255,0.04);

    border:
        1px solid
        rgba(255,208,0,0.3);

    border-radius: 10px;

    font-size: 13px;

}


/* =====================================================
   AUDIO
   ===================================================== */

#audioPlayer {

    display: none;

}


/* =====================================================
   CASTER LIVE
   ===================================================== */

#casterLive {

    width: 100%;

    max-width: 700px;

    margin:
        10px
        auto;

}


/* =====================================================
   FOOTER
   ===================================================== */

.footer {

    width: 100%;

    padding:
        8px
        10px;

    text-align: center;

    color: #687989;

    font-size: 10px;

    border-top:
        1px solid
        rgba(255,255,255,0.08);

}


.footer span {

    color: #ffd000;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    .brandName {

        font-size: 17px;

    }


    .slogan {

        font-size: 11px;

    }


    .redDot {

        width: 18px;
        height: 18px;

        min-width: 18px;

    }


    .liveBadge {

        padding:
            9px
            12px;

        font-size: 12px;

    }


    #bigPlayButton {

        width: 155px;

        height: 155px;

        font-size: 70px;

    }


    .buttonLabel {

        font-size: 18px;

    }

}


/* =====================================================
   SMALL PHONES
   ===================================================== */

@media (max-width: 380px) {

    .brandName {

        font-size: 15px;

    }


    .slogan {

        font-size: 10px;

    }


    #bigPlayButton {

        width: 145px;

        height: 145px;

        font-size: 65px;

    }

}

</style>

</head>


<body>


<div id="radioPlayer">


    <!-- HEADER -->

    <div class="kulzzyHeader">

        <div class="brand">

            <div class="redDot"></div>

            <div>

                <div class="brandName">
                    KULZZY RADIO NETWORK
                </div>

                <div class="slogan">
                    Celebrating Lives Everyday
                </div>

            </div>

        </div>


        <div class="liveBadge">
            ● LIVE
        </div>

    </div>


    <!-- PLAYER -->

    <div class="playerContent">


        <div
            id="statusText"
            class="statusText">

            🎵 AUTOMATIC AUDIO

        </div>


        <!-- BIG PLAY BUTTON -->

        <button
            id="bigPlayButton"
            type="button"
            aria-label="Play Kulzzy Radio">

            ▶

        </button>


        <div
            id="buttonLabel"
            class="buttonLabel">

            TAP TO PLAY

        </div>


        <!-- NOW PLAYING -->

        <div
            id="nowPlaying"
            class="nowPlaying">

            Kulzzy Radio Network
            •
            Celebrating Lives Everyday

        </div>


        <!-- AUDIO -->

        <audio
            id="audioPlayer"
            preload="none"
            playsinline>
        </audio>


        <!-- CASTER LIVE PLAYER -->

        <div
            id="casterLive"
            style="display:none;">

            <div
                data-type="newStreamPlayer"
                data-publicToken="8c96ae48-5e72-43d8-a87e-e90f623ac080"
                data-theme="dark"
                data-color="e81e4d"
                data-channelId="a272a955-fc0c-4968-8280-2a2cb7e434ec"
                data-rendered="false"
                class="cstrEmbed">

                <a href="https://www.caster.fm">
                    Shoutcast Hosting
                </a>

                <a href="https://www.caster.fm">
                    Stream Hosting
                </a>

                <a href="https://www.caster.fm">
                    Radio Server Hosting
                </a>

            </div>

        </div>


    </div>


    <!-- FOOTER -->

    <div class="footer">

        KULZZY RADIO NETWORK
        •
        <span>
            Celebrating Lives Everyday
        </span>

    </div>


</div>


<!-- CASTER SCRIPT -->

<script
src="https://cdn.cloud.caster.fm/widgets/embed.js">
</script>


<script>

/* =====================================================
   KULZZY RADIO PLAYER
   ===================================================== */

const CONFIG_URL = "config.json";


const audio =
    document.getElementById(
        "audioPlayer"
    );


const playButton =
    document.getElementById(
        "bigPlayButton"
    );


const buttonLabel =
    document.getElementById(
        "buttonLabel"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const nowPlaying =
    document.getElementById(
        "nowPlaying"
    );


const casterLive =
    document.getElementById(
        "casterLive"
    );


let currentAudio = "";

let currentMode = "";


/* =====================================================
   LOAD CONFIG
   ===================================================== */

async function loadConfig() {

    try {

        const response =
            await fetch(
                CONFIG_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Config could not be loaded"
            );

        }


        const config =
            await response.json();


        /* NOW PLAYING */

        if (
            config.nowPlaying &&
            config.nowPlaying.trim() !== ""
        ) {

            nowPlaying.textContent =
                config.nowPlaying;

        } else {

            nowPlaying.textContent =
                "Kulzzy Radio Network • Celebrating Lives Everyday";

        }


        /* LIVE */

        if (
            String(config.status)
            .toUpperCase() === "LIVE"
        ) {

            switchToLive();

        }

        /* AUTOMATIC AUDIO */

        else {

            switchToAudio(
                config.currentAudio
            );

        }


    }

    catch (error) {

        console.log(
            "Kulzzy player:",
            error
        );

        statusText.textContent =
            "🎵 AUTOMATIC AUDIO";

    }

}


/* =====================================================
   SWITCH TO LIVE
   ===================================================== */

function switchToLive() {

    if (
        currentMode === "LIVE"
    ) {

        return;

    }


    currentMode = "LIVE";


    /* Stop automatic audio */

    audio.pause();

    audio.removeAttribute(
        "src"
    );

    audio.load();


    /* Show Caster */

    casterLive.style.display =
        "block";


    /* Hide automatic button */

    playButton.style.display =
        "none";

    buttonLabel.style.display =
        "none";


    statusText.textContent =
        "🔴 LIVE ON AIR";

}


/* =====================================================
   SWITCH TO AUTOMATIC AUDIO
   ===================================================== */

function switchToAudio(
    audioFile
) {

    if (
        !audioFile
    ) {

        return;

    }


    currentMode = "AUDIO";


    casterLive.style.display =
        "none";


    playButton.style.display =
        "flex";


    buttonLabel.style.display =
        "block";


    statusText.textContent =
        "🎵 AUTOMATIC AUDIO";


    /* Change audio only when needed */

    if (
        currentAudio !== audioFile
    ) {

        currentAudio =
            audioFile;


        audio.src =
            audioFile +
            "?v=" +
            Date.now();


        audio.load();


        playButton.classList.remove(
            "playing"
        );


        playButton.textContent =
            "▶";


        buttonLabel.textContent =
            "TAP TO PLAY";

    }

}


/* =====================================================
   BIG PLAY BUTTON
   ===================================================== */

playButton.addEventListener(
    "click",
    async function() {


        if (
            currentMode !== "AUDIO"
        ) {

            return;

        }


        try {


            if (
                audio.paused
            ) {


                await audio.play();


                playButton.classList.add(
                    "playing"
                );


                playButton.textContent =
                    "❚❚";


                buttonLabel.textContent =
                    "NOW PLAYING";


            }

            else {


                audio.pause();


                playButton.classList.remove(
                    "playing"
                );


                playButton.textContent =
                    "▶";


                buttonLabel.textContent =
                    "TAP TO PLAY";

            }


        }

        catch (error) {


            console.log(
                "Audio play error:",
                error
            );


            buttonLabel.textContent =
                "TAP TO PLAY";

        }

    }
);


/* =====================================================
   AUDIO ERROR
   ===================================================== */

audio.addEventListener(
    "error",
    function() {

        console.log(
            "Audio file could not be played:",
            audio.src
        );

    }
);


/* =====================================================
   AUDIO ENDED
   ===================================================== */

audio.addEventListener(
    "ended",
    function() {

        playButton.classList.remove(
            "playing"
        );


        playButton.textContent =
            "▶";


        buttonLabel.textContent =
            "TAP TO PLAY";

    }
);


/* =====================================================
   START
   ===================================================== */

loadConfig();


/* CHECK CONFIG EVERY 5 SECONDS */

setInterval(
    loadConfig,
    1000
);

</script>


</body>

      </html>
