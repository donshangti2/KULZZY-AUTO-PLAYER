<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;
    padding: 20px;

    background: #020d1a;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

.container {

    width: 100%;

    max-width: 650px;

    margin: auto;

    background: #03182c;

    padding: 25px;

    border-radius: 15px;

    border:
        2px solid #ffd000;

    box-shadow:
        0 0 30px
        rgba(0,0,0,0.5);

}

h1 {

    text-align: center;

    color: #ffd000;

    margin-top: 0;

}

.subtitle {

    text-align: center;

    color: #aeb9c5;

    margin-bottom: 25px;

}

label {

    display: block;

    margin-top: 18px;

    margin-bottom: 8px;

    color: #ffd000;

    font-weight: bold;

}

input,
select {

    width: 100%;

    padding: 14px;

    border-radius: 8px;

    border:
        1px solid #44576b;

    background: #020d1a;

    color: white;

    font-size: 16px;

}

select option {

    background: #020d1a;

    color: white;

}

.modeButtons {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

}

.modeButton {

    padding: 16px 8px;

    border-radius: 10px;

    border:
        2px solid #44576b;

    background: #020d1a;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}

.modeButton.active {

    border-color: #ffd000;

    background: #17344d;

    color: #ffd000;

}

.liveButton {

    width: 100%;

    margin-top: 20px;

    padding: 18px;

    border: none;

    border-radius: 10px;

    background: #ff0015;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}

.saveButton {

    width: 100%;

    margin-top: 20px;

    padding: 18px;

    border: none;

    border-radius: 10px;

    background: #ffd000;

    color: #020d1a;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}

.status {

    margin-top: 20px;

    padding: 15px;

    border-radius: 8px;

    background: #020d1a;

    color: #ffd000;

    text-align: center;

    word-break: break-word;

}

.note {

    margin-top: 15px;

    padding: 12px;

    border-radius: 8px;

    background:
        rgba(255,208,0,0.08);

    color: #c7d0d9;

    font-size: 13px;

    line-height: 1.5;

}

@media (max-width: 500px) {

    .container {

        padding: 18px;

    }

    .modeButtons {

        grid-template-columns: 1fr;

    }

}

</style>

</head>

<body>

<div class="container">

<h1>
🎛️ KULZZY RADIO ADMIN
</h1>

<div class="subtitle">
Kulzzy Radio Network • Celebrating Lives Everyday
</div>


<!-- SONG -->

<label>
🎵 SELECT AUDIO
</label>

<select id="audioSelect">

    <option value="">
        Select a song
    </option>

    <option value="audio/ON_AIR_BIRTHDAY_SONG_BASS_ONLY.mp3">
        ON AIR BIRTHDAY SONG
    </option>

    <option value="audio/ON_AIR_BUSINESS_O'CLOCK .mp3">
        ON AIR BUSINESS O'CLOCK
    </option>

    <option value="audio/RADIO_MONTHLY_SONG.mp3">
        RADIO MONTHLY SONG
    </option>

</select>


<!-- NOW PLAYING -->

<label>
📻 NOW PLAYING
</label>

<input
    id="nowPlaying"
    type="text"
    placeholder="Example: Kulzzy Radio Birthday Show">


<!-- PLAY MODE -->

<label>
🔁 PLAY MODE
</label>

<div class="modeButtons">

    <button
        id="repeatButton"
        class="modeButton active"
        type="button">

        🔁 REPEAT SONG

    </button>

    <button
        id="onceButton"
        class="modeButton"
        type="button">

        ▶️ PLAY ONCE

    </button>

</div>


<div class="note">

<strong>Repeat Song:</strong>
The selected audio will continuously repeat until you change it.

<br><br>

<strong>Play Once:</strong>
The selected audio will stop when it reaches the end.

</div>


<!-- SAVE AUDIO -->

<button
    id="saveButton"
    class="saveButton"
    type="button">

    💾 SAVE & PLAY AUDIO

</button>


<!-- LIVE -->

<button
    id="liveButton"
    class="liveButton"
    type="button">

    🔴 GO LIVE ON CASTER.FM

</button>


<div
    id="status"
    class="status">

    Ready

</div>

</div>


<script>

/* =====================================================
   KULZZY RADIO ADMIN
   ===================================================== */

const GITHUB_USERNAME =
    "donshangti2";

const REPOSITORY =
    "KULZZY-AUTO-PLAYER";

const CONFIG_FILE =
    "config.json";


/*
   IMPORTANT:
   Your GitHub Personal Access Token
   is requested here.

   It is NOT saved into the website.
*/

let playMode =
    "REPEAT";


/* =====================================================
   ELEMENTS
   ===================================================== */

const audioSelect =
    document.getElementById(
        "audioSelect"
    );

const nowPlaying =
    document.getElementById(
        "nowPlaying"
    );

const repeatButton =
    document.getElementById(
        "repeatButton"
    );

const onceButton =
    document.getElementById(
        "onceButton"
    );

const saveButton =
    document.getElementById(
        "saveButton"
    );

const liveButton =
    document.getElementById(
        "liveButton"
    );

const status =
    document.getElementById(
        "status"
    );


/* =====================================================
   PLAY MODE
   ===================================================== */

repeatButton.addEventListener(
    "click",
    function() {

        playMode =
            "REPEAT";

        repeatButton.classList.add(
            "active"
        );

        onceButton.classList.remove(
            "active"
        );

    }
);


onceButton.addEventListener(
    "click",
    function() {

        playMode =
            "ONCE";

        onceButton.classList.add(
            "active"
        );

        repeatButton.classList.remove(
            "active"
        );

    }
);


/* =====================================================
   GET GITHUB TOKEN
   ===================================================== */

function getToken() {

    let token =
        localStorage.getItem(
            "kulzzyGithubToken"
        );

    if (!token) {

        token =
            prompt(
                "Enter your GitHub Personal Access Token:"
            );

        if (!token) {

            throw new Error(
                "GitHub token is required."
            );

        }

        localStorage.setItem(
            "kulzzyGithubToken",
            token
        );

    }

    return token;

}


/* =====================================================
   UPDATE CONFIG
   ===================================================== */

async function updateConfig(
    newConfig
) {

    const token =
        getToken();


    status.textContent =
        "⏳ Updating radio...";


    /* Get current config */

    const getResponse =
        await fetch(
            "https://api.github.com/repos/" +
            GITHUB_USERNAME +
            "/" +
            REPOSITORY +
            "/contents/" +
            CONFIG_FILE,
            {
                headers: {

                    Authorization:
                        "Bearer " +
                        token,

                    Accept:
                        "application/vnd.github+json"

                }

            }
        );


    if (!getResponse.ok) {

        throw new Error(
            "Could not read config.json"
        );

    }


    const file =
        await getResponse.json();


    /* Encode JSON */

    const content =
        btoa(
            unescape(
                encodeURIComponent(
                    JSON.stringify(
                        newConfig,
                        null,
                        2
                    )
                )
            )
        );


    /* Update */

    const putResponse =
        await fetch(
            "https://api.github.com/repos/" +
            GITHUB_USERNAME +
            "/" +
            REPOSITORY +
            "/contents/" +
            CONFIG_FILE,
            {

                method:
                    "PUT",

                headers: {

                    Authorization:
                        "Bearer " +
                        token,

                    Accept:
                        "application/vnd.github+json",

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        message:
                            "Update Kulzzy Radio",

                        content:
                            content,

                        sha:
                            file.sha

                    })

            }
        );


    if (!putResponse.ok) {

        const error =
            await putResponse.text();

        throw new Error(
            error
        );

    }


    return true;

}


/* =====================================================
   SAVE AUDIO
   ===================================================== */

saveButton.addEventListener(
    "click",
    async function() {

        try {

            const selectedAudio =
                audioSelect.value;


            if (!selectedAudio) {

                alert(
                    "Please select an audio file."
                );

                return;

            }


            const title =
                nowPlaying.value.trim();


            const config = {

                version: 1,

                currentAudio:
                    selectedAudio,

                nowPlaying:
                    title,

                title:
                    "AUTOMATIC AUDIO",

                status:
                    "AUDIO",

                background:
                    "",

                volume:
                    1,

                playlistMode:
                    false,

                playMode:
                    playMode,

                refresh:
                    1

            };


            await updateConfig(
                config
            );


            status.textContent =
                playMode === "REPEAT"
                ? "🔁 REPEAT SONG IS NOW PLAYING"
                : "▶️ SONG SET TO PLAY ONCE";

        }

        catch (error) {

            console.error(
                error
            );

            status.textContent =
                "❌ " +
                error.message;

        }

    }
);


/* =====================================================
   GO LIVE
   ===================================================== */

liveButton.addEventListener(
    "click",
    async function() {

        try {

            const config = {

                version: 1,

                currentAudio:
                    "audio/LIVE_ON_AIR_BDS_96KBPS-compressed.mp3",

                nowPlaying:
                    "",

                title:
                    "LIVE ON AIR",

                status:
                    "LIVE",

                background:
                    "",

                volume:
                    1,

                playlistMode:
                    false,

                playMode:
                    "REPEAT",

                refresh:
                    1

            };


            await updateConfig(
                config
            );


            status.textContent =
                "🔴 LIVE ON AIR";

        }

        catch (error) {

            console.error(
                error
            );

            status.textContent =
                "❌ " +
                error.message;

        }

    }
);

</script>

</body>
 </html>
