<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #020d1a;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #ffd000;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aeb9c5;
    margin-bottom: 25px;
}

.card {
    background: #03182c;
    border: 1px solid #294158;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    color: #ffd000;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #506174;
    background: #071d31;
    color: white;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 12px;
}

.liveButton {
    background: #ed1c24;
    color: white;
}

.audioButton {
    background: #ffd000;
    color: #00101d;
}

.saveButton {
    background: #16c784;
    color: white;
}

.statusBox {
    padding: 15px;
    border-radius: 10px;
    background: #071d31;
    border: 1px solid #394d61;
    text-align: center;
    margin-bottom: 20px;
}

.liveStatus {
    color: #ff3333;
    font-weight: bold;
}

.audioStatus {
    color: #ffd000;
    font-weight: bold;
}

.small {
    color: #8e9baa;
    font-size: 12px;
    line-height: 1.5;
    margin-top: 15px;
}

#message {
    text-align: center;
    padding: 12px;
    margin-top: 15px;
    border-radius: 8px;
    display: none;
}

.success {
    background: #073d27;
    color: #4cffad;
}

.error {
    background: #4a1010;
    color: #ff7777;
}

</style>

</head>

<body>

<div class="container">

<h1>🎙️ KULZZY RADIO</h1>

<div class="subtitle">
ADMIN CONTROL PANEL
</div>


<div class="card">

<div class="statusBox">

CURRENT MODE

<div id="currentMode">
Checking...
</div>

</div>


<label>GitHub Personal Access Token</label>

<input
type="password"
id="githubToken"
placeholder="Paste your GitHub token here">


<label>GitHub Username</label>

<input
type="text"
id="githubUser"
value="donshangti2">


<label>Repository</label>

<input
type="text"
id="githubRepo"
value="KULZZY-AUTO-PLAYER">


<label>Branch</label>

<input
type="text"
id="githubBranch"
value="main">


<button
class="liveButton"
onclick="goLive()">

🔴 GO LIVE ON CASTER.FM

</button>


<button
class="audioButton"
onclick="showAudioMode()">

🎵 PLAY AUTOMATIC AUDIO

</button>

</div>


<div class="card" id="audioSettings">

<label>Select Audio</label>

<select id="audioFile">

<option value="audio/ON_AIR_BIRTHDAY_SONG_BASS_ONLY.mp3">
Birthday Song
</option>

<option value="audio/ON_AIR_BUSINESS_O'CLOCK .mp3">
Business O'Clock
</option>

<option value="audio/RADIO_MONTHLY_SONG.mp3">
Radio Monthly Song
</option>

</select>


<label>Now Playing</label>

<input
type="text"
id="nowPlaying"
value="Kulzzy Radio Network">


<label>Player Title</label>

<input
type="text"
id="radioTitle"
value="KULZZY RADIO NETWORK">


<button
class="saveButton"
onclick="saveAudio()">

💾 SAVE & PLAY AUDIO

</button>

</div>


<div id="message"></div>


<div class="card">

<div class="small">

<strong>How to use:</strong><br><br>

🔴 When you start broadcasting on Caster.fm:
press <strong>GO LIVE ON CASTER.FM</strong>.<br><br>

🎵 When you stop your live broadcast:
select your audio and press <strong>SAVE & PLAY AUDIO</strong>.<br><br>

The website will read the new configuration automatically.

</div>

</div>

</div>


<script>

const CONFIG_PATH = "config.json";


function getSettings() {

    return {

        token:
            document.getElementById("githubToken").value.trim(),

        user:
            document.getElementById("githubUser").value.trim(),

        repo:
            document.getElementById("githubRepo").value.trim(),

        branch:
            document.getElementById("githubBranch").value.trim()

    };

}


async function getConfig(settings) {

    const url =
        `https://api.github.com/repos/${settings.user}/${settings.repo}/contents/${CONFIG_PATH}?ref=${settings.branch}`;

    const response = await fetch(url, {

        headers: {

            "Authorization":
                `Bearer ${settings.token}`,

            "Accept":
                "application/vnd.github+json"

        }

    });

    if (!response.ok) {

        throw new Error(
            "Unable to read config.json"
        );

    }

    return await response.json();

}


async function updateConfig(newConfig, commitMessage) {

    const settings = getSettings();

    if (!settings.token) {

        showMessage(
            "Please enter your GitHub Personal Access Token.",
            true
        );

        return;

    }


    try {

        showMessage(
            "Publishing changes to GitHub..."
        );


        const existing =
            await getConfig(settings);


        const content =
            btoa(
                unescape(
                    encodeURIComponent(
                        JSON.stringify(
                            newConfig,
                            null,
                            2
                        )
                    )
                )
            );


        const url =
            `https://api.github.com/repos/${settings.user}/${settings.repo}/contents/${CONFIG_PATH}`;


        const response =
            await fetch(url, {

                method: "PUT",

                headers: {

                    "Authorization":
                        `Bearer ${settings.token}`,

                    "Accept":
                        "application/vnd.github+json",

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    message: commitMessage,

                    content: content,

                    sha: existing.sha,

                    branch: settings.branch

                })

            });


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);

        }


        showMessage(
            "✅ Successfully published to GitHub."
        );

        loadCurrentMode();

    }

    catch (error) {

        console.error(error);

        showMessage(
            "❌ Error: " + error.message,
            true
        );

    }

}


async function goLive() {

    const settings = getSettings();

    if (!settings.token) {

        showMessage(
            "Enter your GitHub token first.",
            true
        );

        return;

    }


    try {

        const existing =
            await getConfig(settings);


        const config =
            JSON.parse(
                decodeURIComponent(
                    escape(
                        atob(
                            existing.content
                                .replace(/\n/g, "")
                        )
                    )
                )
            );


        config.version = 2;

        config.mode = "LIVE";

        config.status = "LIVE";

        config.title =
            "KULZZY RADIO NETWORK";

        config.nowPlaying =
            "LIVE ON AIR";


        await updateConfig(

            config,

            "Switch Kulzzy Radio to LIVE"

        );

    }

    catch (error) {

        showMessage(
            "❌ " + error.message,
            true
        );

    }

}


async function saveAudio() {

    const settings = getSettings();

    if (!settings.token) {

        showMessage(
            "Enter your GitHub token first.",
            true
        );

        return;

    }


    try {

        const existing =
            await getConfig(settings);


        const config =
            JSON.parse(
                decodeURIComponent(
                    escape(
                        atob(
                            existing.content
                                .replace(/\n/g, "")
                        )
                    )
                )
            );


        config.version = 2;

        config.mode = "AUDIO";

        config.status = "AUDIO";

        config.currentAudio =
            document.getElementById(
                "audioFile"
            ).value;

        config.nowPlaying =
            document.getElementById(
                "nowPlaying"
            ).value;

        config.title =
            document.getElementById(
                "radioTitle"
            ).value;


        await updateConfig(

            config,

            "Switch Kulzzy Radio to automatic audio"

        );

    }

    catch (error) {

        showMessage(
            "❌ " + error.message,
            true
        );

    }

}


function showAudioMode() {

    document.getElementById(
        "audioSettings"
    ).scrollIntoView({

        behavior: "smooth"

    });

}


function showMessage(text, error = false) {

    const box =
        document.getElementById("message");

    box.style.display = "block";

    box.className =
        error ? "error" : "success";

    box.textContent = text;

}


async function loadCurrentMode() {

    try {

        const response =
            await fetch(
                "config.json?time=" +
                Date.now()
            );

        const config =
            await response.json();


        const mode =
            document.getElementById(
                "currentMode"
            );


        if (config.mode === "LIVE") {

            mode.className =
                "liveStatus";

            mode.textContent =
                "🔴 LIVE ON CASTER.FM";

        }

        else {

            mode.className =
                "audioStatus";

            mode.textContent =
                "🎵 AUTOMATIC AUDIO";

        }

    }

    catch {

        document.getElementById(
            "currentMode"
        ).textContent =
            "Unable to read configuration.";

    }

}


loadCurrentMode();

</script>

</body>
</html>
