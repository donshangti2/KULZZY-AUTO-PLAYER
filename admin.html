<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #020d1a;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    background: #03182c;
    padding: 25px;
    border-radius: 15px;
    border: 2px solid #ffd000;
    box-shadow: 0 0 30px rgba(0,0,0,.5);
}

h1 {
    text-align: center;
    color: #ffd000;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    color: #aeb9c5;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    color: #ffd000;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #44576b;
    background: #020d1a;
    color: white;
    font-size: 16px;
}

select option {
    background: #020d1a;
    color: white;
}

/* TOKEN */

.tokenBox {
    margin-bottom: 20px;
    padding: 15px;
    background: #020d1a;
    border-radius: 10px;
    border: 1px solid #26384a;
}

.tokenStatus {
    color: #55ff88;
    font-size: 13px;
    margin-bottom: 10px;
}

#tokenInput {
    display: none;
    margin-bottom: 10px;
}

.tokenButton {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #55697c;
    background: #10283d;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

/* MODE */

.modeButtons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.modeButton {
    padding: 16px 8px;
    border-radius: 10px;
    border: 2px solid #44576b;
    background: #020d1a;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.modeButton.active {
    border-color: #ffd000;
    background: #17344d;
    color: #ffd000;
}

/* BUTTONS */

.saveButton {
    width: 100%;
    margin-top: 20px;
    padding: 18px;
    border: none;
    border-radius: 10px;
    background: #ffd000;
    color: #020d1a;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.liveButton {
    width: 100%;
    margin-top: 15px;
    padding: 18px;
    border: none;
    border-radius: 10px;
    background: #ff0015;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

/* STATUS */

.status {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    background: #020d1a;
    color: #ffd000;
    text-align: center;
    word-break: break-word;
}

.note {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: rgba(255,208,0,.08);
    color: #c7d0d9;
    font-size: 13px;
    line-height: 1.5;
}

@media (max-width: 500px) {

    .container {
        padding: 18px;
    }

    .modeButtons {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>🎛️ KULZZY RADIO ADMIN</h1>

<div class="subtitle">
Kulzzy Radio Network • Celebrating Lives Everyday
</div>


<!-- =====================================================
     GITHUB AUTHORIZATION
     ===================================================== -->

<div class="tokenBox">

    <div
        id="tokenStatus"
        class="tokenStatus">
        Checking authorization...
    </div>

    <input
        id="tokenInput"
        type="password"
        autocomplete="off"
        placeholder="Paste your GitHub token">

    <button
        id="tokenButton"
        class="tokenButton"
        type="button">

        🔑 SET GITHUB TOKEN

    </button>

</div>


<!-- =====================================================
     AUDIO
     ===================================================== -->

<label>🎵 SELECT AUDIO</label>

<select id="audioSelect">

    <option value="">
        Loading songs...
    </option>

</select>


<!-- =====================================================
     NOW PLAYING
     ===================================================== -->

<label>📻 NOW PLAYING</label>

<input
    id="nowPlaying"
    type="text"
    placeholder="Example: Birthday Celebration">


<!-- =====================================================
     PLAY MODE
     ===================================================== -->

<label>🔁 PLAY MODE</label>

<div class="modeButtons">

    <button
        id="repeatButton"
        class="modeButton active"
        type="button">

        🔁 REPEAT SONG

    </button>

    <button
        id="onceButton"
        class="modeButton"
        type="button">

        ▶️ PLAY ONCE

    </button>

</div>

<div class="note">

<strong>🔁 Repeat Song</strong><br>
The selected song will automatically start again when it finishes.

<br><br>

<strong>▶️ Play Once</strong><br>
The selected song will stop when it finishes.

</div>


<!-- =====================================================
     SAVE AUDIO
     ===================================================== -->

<button
    id="saveButton"
    class="saveButton"
    type="button">

    💾 SAVE & PLAY AUDIO

</button>


<!-- =====================================================
     LIVE
     ===================================================== -->

<button
    id="liveButton"
    class="liveButton"
    type="button">

    🔴 GO LIVE ON CASTER.FM

</button>


<!-- =====================================================
     STATUS
     ===================================================== -->

<div
    id="status"
    class="status">

    Ready

</div>

</div>


<script>

/* =====================================================
   KULZZY RADIO ADMIN
   ===================================================== */


/* =====================================================
   GITHUB SETTINGS
   ===================================================== */

const GITHUB_USERNAME = "donshangti2";

const REPOSITORY = "KULZZY-AUTO-PLAYER";

const CONFIG_FILE = "config.json";

const AUDIO_FOLDER = "audio";


/* =====================================================
   LOCAL TOKEN KEY
   ===================================================== */

const TOKEN_KEY = "KULZZY_RADIO_GITHUB_TOKEN";


/* =====================================================
   PLAY MODE
   ===================================================== */

let playMode = "REPEAT";


/* =====================================================
   ELEMENTS
   ===================================================== */

const tokenStatus =
    document.getElementById("tokenStatus");

const tokenInput =
    document.getElementById("tokenInput");

const tokenButton =
    document.getElementById("tokenButton");

const audioSelect =
    document.getElementById("audioSelect");

const nowPlaying =
    document.getElementById("nowPlaying");

const repeatButton =
    document.getElementById("repeatButton");

const onceButton =
    document.getElementById("onceButton");

const saveButton =
    document.getElementById("saveButton");

const liveButton =
    document.getElementById("liveButton");

const status =
    document.getElementById("status");


/* =====================================================
   GET SAVED TOKEN
   ===================================================== */

function getToken() {

    return localStorage.getItem(TOKEN_KEY);

}


/* =====================================================
   UPDATE AUTHORIZATION DISPLAY
   ===================================================== */

function updateAuthorization() {

    const token = getToken();

    if (token && token.length > 10) {

        tokenStatus.textContent =
            "🔐 GitHub authorization saved on this device.";

        tokenStatus.style.color =
            "#55ff88";

        tokenInput.style.display =
            "none";

        tokenButton.textContent =
            "🔑 CHANGE GITHUB TOKEN";

    } else {

        tokenStatus.textContent =
            "⚠️ GitHub authorization not yet saved.";

        tokenStatus.style.color =
            "#ffd000";

        tokenInput.style.display =
            "none";

        tokenButton.textContent =
            "🔑 SET GITHUB TOKEN";

    }

}


/* =====================================================
   LOAD ALL MP3 FILES FROM GITHUB AUDIO FOLDER
   ===================================================== */

async function loadAudioFiles() {

    audioSelect.innerHTML =
        '<option value="">⏳ Loading songs...</option>';

    try {

        const apiURL =
            "https://api.github.com/repos/" +
            GITHUB_USERNAME +
            "/" +
            REPOSITORY +
            "/contents/" +
            AUDIO_FOLDER +
            "?t=" +
            Date.now();


        const headers = {

            "Accept":
                "application/vnd.github+json"

        };


        const token = getToken();


        if (token) {

            headers["Authorization"] =
                "Bearer " + token;

        }


        const response =
            await fetch(
                apiURL,
                {
                    method: "GET",
                    headers: headers,
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not read the GitHub audio folder."
            );

        }


        const files =
            await response.json();


        if (!Array.isArray(files)) {

            throw new Error(
                "GitHub did not return the audio folder."
            );

        }


        const audioFiles =
            files
            .filter(function(file) {

                return (
                    file.type === "file" &&
                    /\.mp3$/i.test(file.name)
                );

            })
            .sort(function(a, b) {

                return a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                );

            });


        audioSelect.innerHTML =
            "";


        if (audioFiles.length === 0) {

            audioSelect.innerHTML =
                '<option value="">No MP3 files found</option>';

            status.textContent =
                "⚠️ No MP3 files found in the audio folder.";

            return;

        }


        const firstOption =
            document.createElement("option");

        firstOption.value =
            "";

        firstOption.textContent =
            "Select a song";

        audioSelect.appendChild(
            firstOption
        );


        audioFiles.forEach(function(file) {

            const option =
                document.createElement("option");

            option.value =
                "audio/" + file.name;

            option.textContent =
                file.name
                    .replace(/\.mp3$/i, "")
                    .replace(/_/g, " ");

            audioSelect.appendChild(
                option
            );

        });


        status.textContent =
            "✅ " +
            audioFiles.length +
            " audio file" +
            (audioFiles.length === 1 ? "" : "s") +
            " loaded from GitHub.";


    }

    catch (error) {

        console.error(
            "Audio loading error:",
            error
        );


        audioSelect.innerHTML =
            '<option value="">❌ Could not load songs</option>';


        status.textContent =
            "❌ " +
            error.message;

    }

}


/* =====================================================
   TOKEN BUTTON
   ===================================================== */

tokenButton.addEventListener(
    "click",
    function() {

        const token = getToken();

        if (token) {

            tokenInput.style.display =
                "block";

            tokenInput.value = "";

            tokenButton.textContent =
                "💾 SAVE NEW TOKEN";

            tokenInput.focus();

            return;
        }


        tokenInput.style.display =
            "block";

        tokenButton.textContent =
            "💾 SAVE TOKEN";

        tokenInput.focus();

    }
);


/* =====================================================
   SAVE TOKEN
   ===================================================== */

tokenInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            saveToken();

        }

    }
);


/* =====================================================
   SAVE TOKEN FUNCTION
   ===================================================== */

function saveToken() {

    const token =
        tokenInput.value.trim();


    if (!token) {

        status.textContent =
            "❌ Please paste your GitHub token.";

        tokenInput.focus();

        return;

    }


    localStorage.setItem(
        TOKEN_KEY,
        token
    );


    tokenInput.value = "";

    tokenInput.style.display =
        "none";


    tokenButton.textContent =
        "🔑 CHANGE GITHUB TOKEN";


    updateAuthorization();


    status.textContent =
        "✅ GitHub authorization saved successfully.";


    /* Reload songs after authorization */

    loadAudioFiles();

}


/* =====================================================
   TOKEN SAVE BUTTON
   ===================================================== */

tokenButton.addEventListener(
    "click",
    function() {

        if (
            tokenInput.style.display ===
            "block"
        ) {

            saveToken();

        }

    }
);


/* =====================================================
   PLAY MODE
   ===================================================== */

repeatButton.addEventListener(
    "click",
    function() {

        playMode = "REPEAT";

        repeatButton.classList.add(
            "active"
        );

        onceButton.classList.remove(
            "active"
        );

    }
);


onceButton.addEventListener(
    "click",
    function() {

        playMode = "ONCE";

        onceButton.classList.add(
            "active"
        );

        repeatButton.classList.remove(
            "active"
        );

    }
);


/* =====================================================
   REQUIRE TOKEN
   ===================================================== */

function requireToken() {

    const token = getToken();

    if (!token) {

        tokenInput.style.display =
            "block";

        tokenButton.textContent =
            "💾 SAVE TOKEN";

        tokenInput.focus();

        throw new Error(
            "Please save your GitHub token first."
        );

    }

    return token;

}


/* =====================================================
   GITHUB API
   ===================================================== */

async function updateConfig(config) {

    const token = requireToken();


    status.textContent =
        "⏳ Updating Kulzzy Radio...";


    const apiURL =
        "https://api.github.com/repos/" +
        GITHUB_USERNAME +
        "/" +
        REPOSITORY +
        "/contents/" +
        CONFIG_FILE;


    /* GET CURRENT FILE */

    const getResponse =
        await fetch(
            apiURL,
            {
                method: "GET",

                headers: {

                    "Authorization":
                        "Bearer " + token,

                    "Accept":
                        "application/vnd.github+json"

                },

                cache: "no-store"

            }
        );


    if (!getResponse.ok) {

        if (
            getResponse.status === 401 ||
            getResponse.status === 403
        ) {

            localStorage.removeItem(
                TOKEN_KEY
            );

            updateAuthorization();

            throw new Error(
                "GitHub authorization failed. Please set your new token again."
            );

        }

        throw new Error(
            "Could not read config.json from GitHub."
        );

    }


    const file =
        await getResponse.json();


    /* =================================================
       ENCODE CONFIG
       ================================================= */

    const json =
        JSON.stringify(
            config,
            null,
            2
        );


    const encoded =
        btoa(
            unescape(
                encodeURIComponent(json)
            )
        );


    /* =================================================
       UPDATE FILE
       ================================================= */

    const putResponse =
        await fetch(
            apiURL,
            {
                method: "PUT",

                headers: {

                    "Authorization":
                        "Bearer " + token,

                    "Accept":
                        "application/vnd.github+json",

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        message:
                            "Update Kulzzy Radio config",

                        content:
                            encoded,

                        sha:
                            file.sha

                    })

            }
        );


    if (!putResponse.ok) {

        const errorText =
            await putResponse.text();

        throw new Error(
            "GitHub update failed: " +
            errorText
        );

    }


    return true;

}


/* =====================================================
   SAVE AUDIO
   ===================================================== */

saveButton.addEventListener(
    "click",
    async function() {

        try {

            const audioFile =
                audioSelect.value;


            if (!audioFile) {

                status.textContent =
                    "❌ Select an audio file first.";

                return;

            }


            const title =
                nowPlaying.value.trim();


            const config = {

                version: 1,

                currentAudio:
                    audioFile,

                nowPlaying:
                    title,

                title:
                    "AUTOMATIC AUDIO",

                status:
                    "AUDIO",

                background:
                    "",

                volume:
                    1,

                playlistMode:
                    false,

                playMode:
                    playMode,

                refresh:
                    1

            };


            await updateConfig(
                config
            );


            if (
                playMode ===
                "REPEAT"
            ) {

                status.textContent =
                    "🔁 REPEAT SONG SAVED — RADIO UPDATED";

            } else {

                status.textContent =
                    "▶️ PLAY ONCE SAVED — RADIO UPDATED";

            }

        }

        catch (error) {

            console.error(error);

            status.textContent =
                "❌ " +
                error.message;

        }

    }
);


/* =====================================================
   GO LIVE
   ===================================================== */

liveButton.addEventListener(
    "click",
    async function() {

        try {

            const config = {

                version: 1,

                currentAudio:
                    "audio/LIVE_ON_AIR_BDS_96KBPS-compressed.mp3",

                nowPlaying:
                    "",

                title:
                    "LIVE ON AIR",

                status:
                    "LIVE",

                background:
                    "",

                volume:
                    1,

                playlistMode:
                    false,

                playMode:
                    "REPEAT",

                refresh:
                    1

            };


            await updateConfig(
                config
            );


            status.textContent =
                "🔴 LIVE MODE ACTIVATED";

        }

        catch (error) {

            console.error(error);

            status.textContent =
                "❌ " +
                error.message;

        }

    }
);


/* =====================================================
   START
   ===================================================== */

updateAuthorization();

/* Automatically load every MP3 from GitHub */

loadAudioFiles();


/* =====================================================
   REFRESH AUDIO LIST WHEN PANEL RETURNS
   ===================================================== */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible"
        ) {

            loadAudioFiles();

        }

    }
);

</script>

</body>
</html>
