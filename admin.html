<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kulzzy Admin</title>

<style>

body{
background:#111;
color:#fff;
font-family:Arial;
padding:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:18px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
font-size:22px;
background:#d60000;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

textarea{
width:100%;
height:250px;
margin-top:20px;
font-size:15px;
}

h2{
text-align:center;
}

</style>

</head>

<body>

<h2>🎙 Kulzzy Radio Admin</h2>
<label><b>GitHub Token</b></label>

<input
id="token"
type="password"
placeholder="Paste your GitHub Personal Access Token">

<button onclick="saveToken()">
🔐 Save Token
</button>

<br><br>
<label><b>Player Mode</b></label>

<select id="mode" style="
width:100%;
padding:12px;
margin:10px 0;
font-size:18px;
">

<option value="live">🎙 LIVE MODE</option>

<option value="playlist">🎵 PLAYLIST MODE</option>

</select>
<label><b>Select Audio</b></label>

<select id="audio" style="
width:100%;
padding:12px;
margin:10px 0;
font-size:18px;
">
</select>
<input
id="now"
placeholder="Now Playing">

<input
id="title"
placeholder="LIVE Title"
value="LIVE ON AIR">

<button onclick="saveToGitHub()">
💾 Save
</button>
<textarea id="output"></textarea>

<br><br>

<button onclick="copyConfig()">
📋 Copy Config
</button>

<script>

</script>

</body>

  </html>
