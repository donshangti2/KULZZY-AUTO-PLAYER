<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kulzzy Admin</title>

<style>

body{
background:#111;
color:#fff;
font-family:Arial;
padding:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:18px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
font-size:22px;
background:#d60000;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

textarea{
width:100%;
height:250px;
margin-top:20px;
font-size:15px;
}

h2{
text-align:center;
}

</style>

</head>

<body>

<h2>🎙 Kulzzy Radio Admin</h2>

<input
id="audio"
placeholder="audio/LIVE_ON_AIR_BDS_96KBPS-compressed.mp3">

<input
id="now"
placeholder="Now Playing">

<input
id="title"
placeholder="LIVE Title"
value="🔴 LIVE ON AIR">

<button onclick="generate()">
Generate Config
</button>

<textarea id="output"></textarea>

<script>

function generate(){

const config={

version:1,

currentAudio:
document.getElementById("audio").value,

nowPlaying:
document.getElementById("now").value,

title:
document.getElementById("title").value,

status:"LIVE",

background:"",

volume:1,

refresh:5

};

document.getElementById("output").value=
JSON.stringify(config,null,2);

}

</script>

</body>

  </html>
